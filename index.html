                theology: "在利未記26章前段的祝福中，充滿了神主動的動詞：「我給/賜」：降時雨、賜平安、立帳幕在百姓中間。物質的豐收、群體的平安、屬靈的同在，這三重祝福全建立在一個簡單的要求上：「遵行律例誡命」。這不是一場等價交換的交易，而是天父樂意傾倒在順服兒女身上的厚恩。",
                heart: "我們常有一種宗教本能，把上帝當作許願池或交易對象，以為要拿些特別的東西、做些偉大的事、受些苦，才能「換來」祂的祝福。其實上帝是主動「給」的父親，祂要的不是我們跟祂講條件，而是單純的信靠與順服。放下交易與懼怕的心態，你會看見日常生活中，早已充滿了祂主動賜下的恩典與平安。",
                action: "今天停止與上帝「交易」。禱告時不加任何條件、不開任何支票，單單為祂已經賜下的平安、供應與十字架的救恩獻上感謝。",
                question: "你心裡的那位上帝，是等你「表現夠好」才發獎品的機器，還是樂意主動賜福、與你同在的父親？",
                prayer: "天父，謝謝祢樂意主動賜福給我。求祢打破我心中宗教交易的模式，讓我單純因愛祢而喜悅遵行祢的誡命，享受祢的同在。阿們。"
            },
            30: {
                title: "聽話就得，不需講數",
                verse: "耶和華對摩西說：你曉諭以色列人說：人還特許的願，被許的人要按你所估的價值歸給耶和華。",
                ref: "利未記 27:1-2",
                theology: "利未記以許願條例作結，這並非鼓勵人許願，而是為「偏要許願」的人立下界線（許了就要還，贖回還要加五分之一）。傳道書說：許願不還不如不許。獻上甚麼願，都換不來祝福，因為26章已明言，蒙福的唯一途徑是「遵行誡命」。上帝不是民間信仰中可以收買的菩薩；天父要的不是兒女跟祂講數，而是「聽話」。",
                heart: "考試前、家人病了、艱難臨到，我們常急著跟神開條件：「神啊只要祢幫我，我就奉獻、我就事奉」。講員一語道破：這反映出我們根本不了解祂。連地上的父親都會把好東西給兒女，何況天父？真正的信仰不是「我要怎樣乖祢才愛我」，而是「學多少就行多少」。不講數，單純聽話；偶然跌倒也不用驚慌，懂得轉回去，就沒事。",
                action: "回顧這30天的靈修，寫下一個你最想在生活中落實的「順服（聽話）」行動。立志不講條件地跟隨主，學多少就行多少。",
                question: "回顧這一個月，你對「聖潔」、「界線」與「順服」有了什麼新的體會？你願意放下講數的心態，單純作個「聽話」的孩子嗎？",
                prayer: "親愛的天父，感謝祢這一個月透過利未記對我說話。求聖靈除去我心中根深蒂固的交易觀念，叫我一生甘心樂意地信服祢。阿們。"
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            let currentDayIndex = 1;

            // Check if current date is November 2026
            if (today.getFullYear() === 2026 && today.getMonth() === 10) { // getMonth is 0-indexed (10 = Nov)
                currentDayIndex = today.getDate();
            }

            // Ensure index is within our bounds (30 days for Nov)
            if (currentDayIndex < 1) currentDayIndex = 1;
            if (currentDayIndex > 30) currentDayIndex = 30;

            renderList();
            displayDay(currentDayIndex);
        });

        function renderList() {
            const listContainer = document.getElementById('day-list');
            listContainer.innerHTML = '';

            for (let i = 1; i <= 30; i++) {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3 rounded-xl mb-1 text-sm transition-all duration-200 border-l-4 ${i === 1 ? 'border-rose-500 bg-stone-800 text-white' : 'border-transparent text-stone-400 hover:bg-stone-800 hover:text-stone-200'}`;
                btn.id = `btn-day-${i}`;
                btn.innerHTML = `<span class="opacity-60 mr-2">11/${i}</span> ${devotionalData[i].title}`;
                btn.onclick = () => displayDay(i);
                listContainer.appendChild(btn);
            }
        }

        let currentUtterance = null;

        function displayDay(day) {
            // Update active state in sidebar
            for (let i = 1; i <= 30; i++) {
                const btn = document.getElementById(`btn-day-${i}`);
                if(btn) {
                    if (i === day) {
                        btn.className = `w-full text-left px-4 py-3 rounded-xl mb-1 text-sm transition-all duration-200 border-l-4 border-rose-500 bg-stone-800 text-white`;
                    } else {
                        btn.className = `w-full text-left px-4 py-3 rounded-xl mb-1 text-sm transition-all duration-200 border-l-4 border-transparent text-stone-400 hover:bg-stone-800 hover:text-stone-200`;
                    }
                }
            }

            const data = devotionalData[day];
            
            // Animation reset
            const contentArea = document.getElementById('content-area');
            contentArea.classList.remove('fade-in');
            void contentArea.offsetWidth; // trigger reflow
            contentArea.classList.add('fade-in');

            // Populate text
            document.getElementById('display-date').textContent = `2026年 11月${day}日`;
            document.getElementById('display-title').textContent = data.title;
            document.getElementById('display-verse').textContent = data.verse;
            document.getElementById('display-ref').textContent = data.ref;
            document.getElementById('display-theology').textContent = data.theology;
            document.getElementById('display-heart').textContent = data.heart;
            document.getElementById('display-action').textContent = data.action;
            document.getElementById('display-question').textContent = data.question;
            document.getElementById('display-prayer').textContent = data.prayer;

            // Stop any ongoing speech when switching days
            if(window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
            document.getElementById('listen-text').textContent = "聆聽內容";

            // Setup Listen Button
            document.getElementById('listen-btn').onclick = () => {
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    document.getElementById('listen-text').textContent = "聆聽內容";
                    return;
                }

                document.getElementById('listen-text').textContent = "停止聆聽";

                // Prepare text, stripping verse refs and formatting
                const fullText = `
                    ${data.title}。
                    ${data.verse}。
                    聖言反思。${data.theology}
                    心靈觀照。${data.heart}
                    生活實踐。${data.action}
                    今日反思問題。${data.question}
                    結束禱告。${data.prayer}
                `;

                // Clean text for speech (Remove brackets and specific symbols as requested)
                let cleanText = fullText
                    .replace(/【.*?】/g, '')
                    .replace(/\[.*?\]/g, '')
                    .replace(/\(.*\)/g, '')
                    // We don't strip normal punctuation because the speech engine needs them for natural pauses.
                    // We just ensure no weird symbols are read out.
                    .replace(/[:：]/g, '。'); 

                currentUtterance = new SpeechSynthesisUtterance(cleanText);
                currentUtterance.lang = 'zh-TW';
                currentUtterance.rate = 0.95; // Slightly slower for devotional tone
                currentUtterance.pitch = 1;

                currentUtterance.onend = () => {
                    document.getElementById('listen-text').textContent = "聆聽內容";
                };

                window.speechSynthesis.speak(currentUtterance);
            };
        }
    </script>
