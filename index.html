    <style>

        body {

            background-color: #fcfbf9;
            color: #333;
            scroll-behavior: smooth;
        }

            transition: all 0.2s ease;

            border-radius: 6px;

            background-color: #ecfdf5; /* emerald-50 */

</head>

                        <h4 class="flex items-center text-sm font-bold text-gray-500 mb-3 uppercase tracking-wide">
                            今日經文
                            <button onclick="speakText('day${data.day}-scripture')" class="ml-2 text-emerald-600 hover:text-emerald-800 p-1 rounded-full hover:bg-emerald-50 transition-colors" title="聆聽此段">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
                            </button>
                        </h4>
                        <div class="bg-gray-50 border-l-4 border-emerald-500 p-5 italic text-gray-700 rounded-r-lg">
                            <p id="day${data.day}-scripture" class="speakable font-medium text-lg leading-relaxed">${data.scripture}</p>
                            <p class="text-sm mt-3 text-gray-500 not-speakable font-sans">${data.reference}</p>
                        </div>
                    </div>

                    <!-- 聖言反思 -->
                    <div>
                        <h4 class="flex items-center text-lg font-bold text-gray-800 mb-3">
                            <svg class="w-5 h-5 mr-2 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                            聖言反思
                            <button onclick="speakText('day${data.day}-reflection')" class="ml-2 text-emerald-600 hover:text-emerald-800 p-1.5 rounded-full hover:bg-emerald-50 transition-colors" title="聆聽此段">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
                            </button>
                        </h4>
                        <div id="day${data.day}-reflection" class="speakable text-gray-700 leading-relaxed">${data.reflection}</div>
                    </div>

                    <!-- 心靈觀照 -->
                    <div>
                        <h4 class="flex items-center text-lg font-bold text-gray-800 mb-3">
                            <svg class="w-5 h-5 mr-2 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                            心靈觀照
                            <button onclick="speakText('day${data.day}-insight')" class="ml-2 text-emerald-600 hover:text-emerald-800 p-1.5 rounded-full hover:bg-emerald-50 transition-colors" title="聆聽此段">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
                            </button>
                        </h4>
                        <div id="day${data.day}-insight" class="speakable text-gray-700 leading-relaxed">${data.insight}</div>
                    </div>

                    <!-- 反思問題 -->
                    <div class="bg-emerald-50 rounded-xl p-6 border border-emerald-100">
                        <h4 class="flex items-center text-lg font-bold text-emerald-900 mb-3">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                            反思問題
                            <button onclick="speakText('day${data.day}-question')" class="ml-2 text-emerald-600 hover:text-emerald-800 p-1.5 rounded-full hover:bg-emerald-100 transition-colors" title="聆聽此段">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
                            </button>
                        </h4>
                        <div id="day${data.day}-question" class="speakable text-emerald-800 font-medium leading-relaxed">${data.question}</div>
                    </div>

                    <!-- 結束禱告 -->
                    <div>
                        <h4 class="flex items-center text-lg font-bold text-gray-800 mb-3">
                            <svg class="w-5 h-5 mr-2 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                            結束禱告
                            <button onclick="speakText('day${data.day}-prayer')" class="ml-2 text-emerald-600 hover:text-emerald-800 p-1.5 rounded-full hover:bg-emerald-50 transition-colors" title="聆聽此段">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
                            </button>
                        </h4>
                        <div id="day${data.day}-prayer" class="speakable text-gray-700 leading-relaxed serif bg-gray-50 p-5 rounded-xl border border-gray-200">${data.prayer}</div>
                    </div>
                </div>
            </article>
            `;
        });

        contentContainer.innerHTML = htmlContent;

        // 渲染大綱結構
        const outlineContainer = document.getElementById('outline-container');
        const weeks = [
            { id: 1, title: "第一週：試煉中的生命重塑", start: 1, end: 10 },
            { id: 2, title: "第二週：神話語的栽種與慢燉", start: 11, end: 17 },
            { id: 3, title: "第三週：愛與人際關係的尊嚴", start: 18, end: 24 },
            { id: 4, title: "第四週：脫離自我作神的世俗", start: 25, end: 31 }
        ];

        let outlineHtml = '';
        weeks.forEach(week => {
            outlineHtml += `
                <div class="bg-white p-6 rounded-xl card-shadow border border-gray-100">
                    <h3 class="text-xl font-bold text-emerald-800 mb-4 pb-2 border-b border-emerald-100">${week.title}</h3>
                    <ul class="space-y-1.5 text-gray-600 text-sm">
            `;
            for (let i = week.start; i <= week.end; i++) {
                const dayData = devotionalData.find(d => d.day === i);
                outlineHtml += `
                        <li class="outline-item flex items-start" onclick="showDay(${i})">
                            <span class="font-bold text-emerald-600 w-14 shrink-0">Day ${i}</span> 
                            <span>${dayData.title}</span>
                        </li>
                `;
            }
            outlineHtml += `
                    </ul>
                </div>
            `;
        });
        outlineContainer.innerHTML = outlineHtml;

        // 切換顯示天數函數
        function showDay(dayNumber) {
            document.querySelectorAll('.day-article').forEach(el => el.classList.remove('active'));
            const targetArticle = document.getElementById(`day${dayNumber}-article`);
            if (targetArticle) {
                targetArticle.classList.add('active');
                document.getElementById('daily-content').scrollIntoView({ behavior: 'smooth' });
                document.getElementById('current-date-display').innerText = `目前顯示：2026年8月${dayNumber}日`;
                stopAudio(); // 切換時自動停止上一個語音
            }
        }

        // 初始載入時顯示正確日期
        showDay(currentActiveDay);

        // TTS 腳本
        if (!('speechSynthesis' in window)) {
            console.warn("此瀏覽器不支援語音合成 (TTS) 功能。");
        }


        function toggleStopButton(show) {
            if (show) stopBtn.classList.add('show');
            else stopBtn.classList.remove('show');
        }

        function setupUtterance(utterance) {
            utterance.onend = () => toggleStopButton(false);
            utterance.onerror = () => toggleStopButton(false);
        }

        function stopAudio() {
            window.speechSynthesis.cancel();
            toggleStopButton(false);
        }

        function speakText(elementId) {
            window.speechSynthesis.cancel();
            const element = document.getElementById(elementId);
            if (!element) return;
            
            const utterance = new SpeechSynthesisUtterance(element.innerText);
            utterance.lang = 'zh-TW';
            utterance.rate = 1.0;
            
            setupUtterance(utterance);
            window.speechSynthesis.speak(utterance);
            toggleStopButton(true);
        }

        function speakDay(articleId) {
            window.speechSynthesis.cancel();
            const dayContainer = document.getElementById(articleId);
            if (!dayContainer) return;
            
            const speakableElements = dayContainer.querySelectorAll('.speakable');
            let fullText = '';
            speakableElements.forEach(el => {
                fullText += el.innerText + '。 ';
            });
            
            const utterance = new SpeechSynthesisUtterance(fullText);
            utterance.lang = 'zh-TW';
            utterance.rate = 1.0;
            
            setupUtterance(utterance);
            window.speechSynthesis.speak(utterance);
            toggleStopButton(true);
        }
    </script>
</body>
</html>
