        let activeDay = 1;
        let speechSynth = window.speechSynthesis;
        let currentUtterance = null;
        let isPlaying = false;

        // 初始化
        function initApp() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1; // JS 的 month 是 0-11
            const date = today.getDate();
            
            // 生成選單
            const selector = document.getElementById('daySelector');
            for (let i = 1; i <= 31; i++) {
                let option = document.createElement('option');
                option.value = i;
                option.text = `10月 ${i} 日 靈修`;
                selector.appendChild(option);
            }

            // --- 判斷 2026 年 10 月的邏輯 ---
            if (year === 2026 && month === 10) {
                // 如果是 2026年10月，則自動跳至當天
                activeDay = date;
                document.getElementById('todayBadge').classList.remove('hidden');
                document.getElementById('dateDisplay').innerText = `今天是 2026年10月${date}日`;
            } else if (year > 2026 || (year === 2026 && month > 10)) {
                // 如果已經過了 2026年10月 (如 11月)，停留在最後一天
                activeDay = 31;
                document.getElementById('dateDisplay').innerText = `今天是 ${year}年${month}月${date}日`;
            } else {
                // 如果還沒到 2026年10月 (如目前的 2026年9月30日)，預設顯示 10 月 1 日預備
                activeDay = 1;
                document.getElementById('dateDisplay').innerText = `今天是 ${year}年${month}月${date}日，為 10 月靈修作預備`;
            }

            selector.value = activeDay;
            renderContent(activeDay);
        }

        // 切換天數
        function switchDay(day) {
            activeDay = parseInt(day);
            const today = new Date();
            
            // 如果手動選擇的日期剛好是 2026年10月的今天，顯示 Badge
            if (today.getFullYear() === 2026 && (today.getMonth() + 1) === 10 && today.getDate() === activeDay) {
                document.getElementById('todayBadge').classList.remove('hidden');
            } else {
                document.getElementById('todayBadge').classList.add('hidden');
            }
            
            renderContent(activeDay);
        }

        // 渲染內容
        function renderContent(day) {
            stopSpeech(); // 切換時停止語音
            
            const container = document.getElementById('devotionalContent');
            const data = devotionals.find(d => d.day === day);
            
            if(!data) return;

            // 重置動畫
            container.classList.remove('fade-in');
            void container.offsetWidth; // trigger reflow
            container.classList.add('fade-in');

            container.innerHTML = `
                <h2 class="text-2xl font-bold text-teal-900 mb-5">10月 ${data.day} 日</h2>
                
                <div class="verse-box p-5 rounded-r-xl mb-7 text-gray-700 font-medium leading-relaxed shadow-sm">
                    ${data.verse}
                </div>
                
                <h3 class="text-lg font-bold text-teal-700 mt-6 mb-2 flex items-center gap-2">
                    <span>📖</span> 聖言反思
                </h3>
                <p class="mb-6 text-gray-600 leading-relaxed text-justify">${data.content}</p>

                <h3 class="text-lg font-bold text-rose-600 mt-6 mb-2 flex items-center gap-2">
                    <span>💡</span> 反思問題
                </h3>
                <p class="mb-6 text-gray-600 leading-relaxed italic bg-rose-50 p-4 rounded-lg border border-rose-100">${data.question}</p>

                <h3 class="text-lg font-bold text-indigo-600 mt-6 mb-2 flex items-center gap-2">
                    <span>🙏</span> 結束祈禱
                </h3>
                <p class="text-gray-600 leading-relaxed bg-indigo-50 p-4 rounded-lg border border-indigo-100">${data.prayer}</p>
            `;
        }

        // 語音功能 (TTS)
        function toggleSpeak() {
            if (isPlaying) {
                stopSpeech();
            } else {
                startSpeech();
            }
        }

        function startSpeech() {
            if (!speechSynth) {
                alert("您的瀏覽器不支援語音功能");
                return;
            }
            
            const data = devotionals.find(d => d.day === activeDay);
            if(!data) return;

            let textToRead = "";
            
            // 處理經文：去掉（）內的章節出處，例如 (傳道書 1:1)
            let cleanVerse = data.verse.replace(/[\(（].*?[\)）]/g, '').trim();
            
            textToRead += `10月${data.day}日靈修。 經文：${cleanVerse}。 `;
            textToRead += `聖言反思：${data.content}。 `;
            textToRead += `反思問題：${data.question}。 `;
            textToRead += `結束祈禱：${data.prayer}。`;

            // 過濾掉表情符號/圖案符號，防止語音朗讀時出現雜音或停頓
            textToRead = textToRead.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F1E6}-\u{1F1FF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}\u{2764}\u{FE0F}\u{200D}]/gu, '');

            currentUtterance = new SpeechSynthesisUtterance(textToRead);
            currentUtterance.lang = 'zh-TW'; 
            currentUtterance.rate = 0.95; // 語速稍微放慢
            
            currentUtterance.onstart = () => {
                isPlaying = true;
                updateTTSUI(true);
            };
            
            currentUtterance.onend = () => {
                isPlaying = false;
                updateTTSUI(false);
            };

            currentUtterance.onerror = (e) => {
                console.error("TTS Error:", e);
                isPlaying = false;
                updateTTSUI(false);
            };

            speechSynth.speak(currentUtterance);
        }

        function stopSpeech() {
            if (speechSynth) {
                speechSynth.cancel();
            }
            isPlaying = false;
            updateTTSUI(false);
        }

        function updateTTSUI(playing) {
            const icon = document.getElementById('ttsIcon');
            const text = document.getElementById('ttsText');
            if (playing) {
                icon.innerText = "⏸️";
                text.innerText = "暫停朗讀";
                icon.classList.add('speaking');
            } else {
                icon.innerText = "🔊";
                text.innerText = "聆聽靈修";
                icon.classList.remove('speaking');
            }
        }

        // 頁面載入時初始化
        window.onload = initApp;

        // 離開頁面時停止播放
        window.onbeforeunload = () => {
            stopSpeech();
        };
    </script>
